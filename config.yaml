project:
  name: SignalGate
  version: "0.1.0"
  mode: decision_support_simulation

reproducibility:
  seeds: [11, 22, 33, 44, 55]
  bootstrap_resamples: 1000

data:
  time_column: TransactionDT
  identifier_column: TransactionID
  target_column: isFraud
  chronological_split:
    train: [0, 60]
    calibration: [60, 70]
    validation: [70, 80]
    test: [80, 100]

budget:
  primary_multiple: 1.5
  sweep_multiples: [1.0, 1.5, 2.0, 3.0]

backend:
  model: sklearn

features:
  velocity: false
  v_pruning: false

explanations:
  enabled: false
  method: null

thresholds: null

acceptance:
  AC1_pp: 2.0
  AC2_reduction: 0.10
  AC3_shift_robustness: 0.0
  AC4_confident_miss_reduction: 0.10
  AC5_p95_ms: 50

agent_acceptance:
  AG1_seeded_false_claim_block_rate: 1.0
  AG2_honest_brief_false_block_rate_max: 0.05
  AG3_chain_verifies_and_tamper_detected: true
  AG4_routing_byte_identical_if_agents_disabled: true
  AG5_test_label_access_fails_closed: true
